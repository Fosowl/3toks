# Local SearXNG for the ThreeToks web vertical.
# Adapted from agenticSeek/searxng/docker-compose.yml: upstream image,
# settings.yml mounted with formats:[html] + limiter:false, valkey cache.
# See README.md for start-up (generate SEARXNG_SECRET first).
services:
  searxng:
    container_name: threetoks-searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:8080/}
      - SEARXNG_SECRET=${SEARXNG_SECRET:?set SEARXNG_SECRET (see README)}
      - GRANIAN_WORKERS=1
      - GRANIAN_BLOCKING_THREADS=1
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    depends_on:
      - valkey
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  valkey:
    container_name: threetoks-valkey
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  valkey-data:
