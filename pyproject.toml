[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3toks"
version = "0.2.0"
description = "Token-frugal agentic framework for small local LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Legrand" }]
dependencies = []

[project.optional-dependencies]
web = ["requests", "beautifulsoup4", "markdownify"]
browser = ["selenium>=4.6"]

[project.scripts]
threetoks = "threetoks.tui:main"

[tool.setuptools.packages.find]
include = ["threetoks*"]

[tool.setuptools.package-data]
"threetoks.agents" = ["*.json"]
