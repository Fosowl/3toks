[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3toks"
version = "0.2.0"
description = "Token-frugal agentic framework for small local LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Legrand" }]
dependencies = []

[project.optional-dependencies]
web = ["requests", "beautifulsoup4", "markdownify"]
browser = ["selenium>=4.6"]
stt = ["vosk", "sounddevice"]
tts = ["piper-tts", "sounddevice", "numpy"]
voice = ["3toks[stt,tts]"]
camera = ["opencv-python"]
relay = [
    "RPi.GPIO; platform_machine == 'aarch64' or platform_machine == 'armv7l' or platform_machine == 'armv6l'",
]

[project.scripts]
threetoks = "threetoks.tui:main"

[tool.setuptools.packages.find]
include = ["threetoks*"]

[tool.setuptools.package-data]
"threetoks.agents" = ["*.json"]
